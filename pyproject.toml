[project]
name = "canes-cfb-analytics"
version = "0.0.1"
description = "Notebook-first college football prediction models: winner, spread, game total and team totals for full game, halves and quarters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Daniel Regalado" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "httpx>=0.27",
    "optuna>=5.0.0",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "tabulate>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canes_cfb"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "nbstripout>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebook setup cells import helpers before sections use them.
"*.ipynb" = ["F401"]
