# Wednesday: grade last week's paper bets, predict the next slate, log new picks.
# Friday: refresh Kalshi prices (quarter markets open Thursday) and rebuild the site.
# Needs the CFBD_API_KEY repository secret (Settings → Secrets → Actions).
name: weekly-predictions

on:
  schedule:
    - cron: "0 13 * * 3" # Wednesdays 13:00 UTC (9:00 ET), before the Thursday games
    - cron: "0 15 * * 5" # Fridays 15:00 UTC: Kalshi snapshot only
  workflow_dispatch:

permissions:
  contents: write

concurrency: weekly-predictions

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FRIDAY: ${{ github.event.schedule == '0 15 * * 5' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen

      # API responses (ESPN, CFBD, weather) and this week's predictions. Restores the
      # latest run's cache so finished weeks aren't downloaded again.
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/predictions
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Predict next slate and log paper bets
        if: env.FRIDAY != 'true'
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: uv run python scripts/predict_week.py

      - name: Grade paper bets
        if: env.FRIDAY != 'true'
        run: uv run python scripts/grade_paper.py

      - name: Kalshi prices for halves, quarters and team totals (information only)
        continue-on-error: true
        run: uv run python scripts/kalshi_snapshot.py

      - name: Build the weekly card site
        run: uv run python scripts/build_site.py

      - name: Commit picks and results
        run: |
          git config user.name "Daniel Regalado"
          git config user.email "250292867+DanielRegaladoUMiami@users.noreply.github.com"
          git add paper_trading/ site/index.html site/rosters.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: weekly paper picks and grading ($(date -u +%F))"
            git push
          fi
